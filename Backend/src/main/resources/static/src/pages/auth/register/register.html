<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/jpeg" href="/favicon-tmcreation.jpeg">

  <title>Crear cuenta | TM Creation</title>

  <link rel="stylesheet" href="../login/login.css">
</head>
<body>

  <video autoplay muted loop playsinline class="video-bg">
    <source src="../../../assets/FondoLogin.mp4" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>

  <div class="video-overlay"></div>

  <div class="login-page">

    <main class="register-container">
      <form id="register-form" novalidate>
        <h2>Crear cuenta</h2>

        <div class="input-group">
          <label for="name">Nombre:</label>
          <input type="text" id="name" required placeholder="Ingresa tu nombre" />
        </div>

        <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com" />
        </div>

        <div class="input-group">
          <label for="password">Contraseña:</label>
          <div class="password-wrapper">
            <input type="password" id="password" required placeholder="••••••••" />
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar contraseña">
              <svg class="eye-icon" viewBox="0 0 24 24" width="22" height="22">
                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle class="eye-open" cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" display="none"/>
                <line class="eye-closed" x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" display="none"/>
              </svg>
            </button>
          </div>

          <small id="passwordHelp" class="password-hint">
            Mínimo <strong>8 caracteres</strong>, una <strong>mayúscula</strong> y una <strong>minúscula</strong>.
          </small>
        </div>

        <button type="submit" class="btn-primary">Registrarse</button>

        <div class="divider">o continuar con</div>

        <button
          type="button"
          id="google-btn"
          class="btn-google">
          <img src="../../../assets/google-logo.png" alt="Google logo">
          Registrarse con Google
        </button>

        <div id="msg" class="msg"></div>

        <p class="footer-text">
          ¿Ya tenés cuenta?
          <a href="../login/login.html">Iniciar sesión</a>
        </p>
      </form>
    </main>

  </div>

  <script type="module" src="./register.js"></script>
  <script>
    document.getElementById('passwordToggle')?.addEventListener('click', function () {
      const input = document.getElementById('password');
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      this.querySelectorAll('.eye-open, .eye-closed').forEach(el => {
        el.style.display = isPassword ? 'none' : '';
      });
      this.querySelectorAll('.eye-closed').forEach(el => {
        el.style.display = isPassword ? '' : 'none';
      });
    });
  </script>

</body>
</html>
