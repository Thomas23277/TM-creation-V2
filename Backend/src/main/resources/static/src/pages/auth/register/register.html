<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/jpeg" href="/favicon-tmcreation.jpeg">

  <title>Crear cuenta | TM Creation</title>
  <script type="module" crossorigin src="/assets/api-BwTScyzt.js"></script>
  <script type="module" crossorigin src="/assets/auth-ieWdpgp-.js"></script>
  <script type="module" crossorigin src="/assets/register-BWucUys1.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/register-DA7BYaBm.css">
  <link rel="stylesheet" crossorigin href="/assets/styles-IZuPY9Um.css">
</head>

<body>

  <video autoplay muted loop playsinline class="video-bg">
    <source src="/assets/FondoLogin-DFDXjV1w.mp4" type="video/mp4">
    Tu navegador no soporta video HTML5.
  </video>

  <div class="video-overlay"></div>

  <div class="register-page">
    
    <main class="register-container">
      <form id="register-form" method="POST" action="#" novalidate>
        <img class="auth-logo" src="/assets/LOGO-PLATEADO-Cd5QPmWY.png" alt="TM Creation">
        <h2>Crear cuenta</h2>

        <div class="input-group">
          <label for="name">Nombre:</label>
          <input type="text" id="name" name="name" required placeholder="Ingresa tu nombre" autocomplete="name" />
        </div>

        <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com" autocomplete="email" />
        </div>

        <div class="input-group">
          <label for="password">Contraseña:</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="new-password" />
            <button type="button" class="password-toggle" aria-label="Mostrar contraseña" tabindex="-1">
              <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          
          <small id="passwordHelp" class="password-hint">
            Mínimo <strong>8 caracteres</strong>, una <strong>mayúscula</strong> y una <strong>minúscula</strong>.
          </small>
        </div>

        <button type="submit" class="btn-primary">Registrarse</button>

        <div class="divider">o continuar con</div>

        <button 
          type="button" 
          id="google-btn" 
          class="btn-google">
          <img src="/assets/google-logo-R9MCtlRJ.png" alt="Google logo">
          Registrarse con Google
        </button>

        <div id="msg" class="msg"></div>

        <p class="footer-text">
          ¿Ya tenés cuenta? 
          <a href="../login/login.html">Iniciar sesión</a>
        </p>
      </form>
    </main>

  </div>

  <script>
    document.querySelectorAll('.password-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var input = this.parentElement.querySelector('input');
        var isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        this.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
        this.querySelector('.eye-open').style.display = isPassword ? 'none' : '';
        this.querySelector('.eye-closed').style.display = isPassword ? '' : 'none';
      });
    });
  </script>
</body>
</html>
